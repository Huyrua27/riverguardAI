[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riverguard-ai"
version = "0.1.0"
description = "Computer-vision system for detecting, tracking and forecasting floating-waste hotspots on rivers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RiverGuard AI Team" },
]
keywords = ["computer-vision", "object-detection", "tracking", "environmental-monitoring", "hotspot-prediction"]

dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "loguru>=0.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
ml = [
    "torch>=2.1",
    "torchvision>=0.16",
    "ultralytics>=8.1",
    "scipy>=1.11",
    "pandas>=2.1",
]
dashboard = [
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "plotly>=5.18",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[project.scripts]
riverguard = "riverguard.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riverguard = ["dashboard/templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=riverguard --cov-report=term-missing"
